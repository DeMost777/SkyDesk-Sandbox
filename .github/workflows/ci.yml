# The same four checks CLAUDE.md requires before every push, on every pull request and on main.
# Vercel only builds previews; it does not run tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm test runs every story as a test in Chromium (Playwright).
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint:tokens
      - run: npm test
      - run: npm run build
      # Vercel's buildCommand also builds Storybook: a broken story file would fail the deploy.
      - run: npm run build-storybook -- --output-dir dist/storybook
